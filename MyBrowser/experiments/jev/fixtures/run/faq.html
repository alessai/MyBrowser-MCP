<div id="pg"><p>General questions about accounts.</p></div><div id="ps" class="hidden"><details id="d1"><summary>Delivery times</summary><p>2-5 days.</p></details><details id="d2"><summary>Returns</summary><p>Returns are accepted within 30 days.</p></details></div><script>window.__done=false;window.__risky=false;ts.onclick=()=>{ pg.classList.add('hidden'); ps.classList.remove('hidden'); ts.setAttribute('aria-selected','true'); tg.setAttribute('aria-selected','false'); }; setInterval(()=>{ window.__done = d2.open && !ps.classList.contains('hidden'); },100);</script>
