<!doctype html><meta charset="utf-8"><title>Sign in</title>
<style>body{font:15px sans-serif;max-width:760px;margin:30px auto} label{display:block;margin:8px 0} .hidden{display:none} .tall{height:1400px}</style>
<h1>Sign in</h1><form id="f"><label>Username <input id="u" name="username"></label><label>Password <input id="p" type="password" name="password"></label><button type="button" id="go">Log in</button></form><div id="msg"></div><script>window.__done=false;window.__risky=false;go.onclick=()=>{ if(u.value==='tomsmith'&&p.value==='SuperSecret!'){ document.body.innerHTML='<h1>Secure area</h1><p>You logged into a secure area!</p><a href="#">Log out</a>'; window.__done=true; } else msg.textContent='Your username is invalid!'; };</script>
