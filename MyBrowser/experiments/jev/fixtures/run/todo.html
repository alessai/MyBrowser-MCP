<!doctype html><meta charset="utf-8"><title>Todo list</title>
<style>body{font:15px sans-serif;max-width:760px;margin:30px auto} label{display:block;margin:8px 0} .hidden{display:none} .tall{height:1400px}</style>
<h1>Todo</h1><label>New task <input id="t"></label><button id="add" type="button">Add task</button><ul id="l"></ul><script>window.__done=false;window.__risky=false;add.onclick=()=>{ if(!t.value) return; const li=document.createElement('li'); li.textContent=t.value; l.appendChild(li); t.value=''; const items=[...l.children].map(x=>x.textContent); window.__done = ['Buy milk','Call bank','Book dentist'].every(x=>items.includes(x)); };</script>
