<!doctype html><meta charset="utf-8"><title>Notification settings</title>
<style>body{font:15px sans-serif;max-width:760px;margin:30px auto} label{display:block;margin:8px 0} .hidden{display:none} .tall{height:1400px}</style>
<h1>Notification settings</h1><section><h2>Email</h2><label><input type="checkbox" id="news" checked> Newsletter</label><label><input type="checkbox" id="promo" checked> Promotions</label><label><input type="checkbox" id="sec" checked> Security alerts</label></section><section><h2>Push</h2><label><input type="checkbox" id="pmsg" checked> Messages</label></section><script>window.__done=false;window.__risky=false;setInterval(()=>{ window.__done = !promo.checked && !news.checked && sec.checked && pmsg.checked; },100);</script>
