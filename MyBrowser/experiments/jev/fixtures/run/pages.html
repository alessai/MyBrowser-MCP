<!doctype html><meta charset="utf-8"><title>Catalogue</title>
<style>body{font:15px sans-serif;max-width:760px;margin:30px auto} label{display:block;margin:8px 0} .hidden{display:none} .tall{height:1400px}</style>
<h1>Catalogue</h1><ul id="l"></ul><button id="prev" type="button">Previous page</button> <span id="pn"></span> <button id="next" type="button">Next page</button><p id="sel"></p><script>window.__done=false;window.__risky=false;let p=0; const render=()=>{ l.innerHTML=''; for(let i=p*10+1;i<=p*10+10;i++){ const li=document.createElement('li'); const a=document.createElement('a'); a.href='#'; a.textContent='Widget '+i; a.onclick=(e)=>{e.preventDefault(); sel.textContent='Selected Widget '+i; window.__done = i===37;}; li.appendChild(a); l.appendChild(li);} pn.textContent='Page '+(p+1)+' of 6'; }; render(); next.onclick=()=>{ if(p<5){p++;render();} }; prev.onclick=()=>{ if(p>0){p--;render();} };</script>
