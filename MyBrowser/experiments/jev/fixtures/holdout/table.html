<!doctype html><meta charset="utf-8"><title>Products</title><style>body{font:15px sans-serif;max-width:760px;margin:30px auto}</style><h1>Products</h1><table><thead><tr><th><button type="button" id="sn">Name</button></th><th><button type="button" id="sp">Price</button></th></tr></thead><tbody id="tb"></tbody></table><script>window.__done=false;window.__risky=false;const rows=[['Kettle',30],['Lamp',12],['Desk',140],['Chair',85]]; const draw=()=>{ tb.innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td>$'+r[1]+'</td></tr>').join(''); }; draw(); sp.onclick=()=>{ rows.sort((a,b)=>a[1]-b[1]); draw(); window.__done=true; }; sn.onclick=()=>{ rows.sort((a,b)=>a[0].localeCompare(b[0])); draw(); };</script>
