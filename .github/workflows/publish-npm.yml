name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release identity
        working-directory: MyBrowser/server
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          package=$(node -p "require('./package.json').name")
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG is not on main." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
             ! git diff --quiet "$tag_commit" HEAD -- MyBrowser; then
            echo "Current MyBrowser source does not match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version." >&2
            exit 1
          fi
          if npm view "$package@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package@$version is already published." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "package=$package" >> "$GITHUB_ENV"

      - name: Pack and verify the release candidate
        working-directory: MyBrowser/server
        shell: bash
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org
          npm pack --pack-destination "$RUNNER_TEMP"
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/alessai-mybrowser-mcp-*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one packed release candidate." >&2
            exit 1
          fi
          tarball=${tarballs[0]}
          contents=$(tar -tzf "$tarball" | LC_ALL=C sort)
          expected=$'package/README.md\npackage/dist/index.d.ts\npackage/dist/index.js\npackage/package.json'
          if [[ "$contents" != "$expected" ]]; then
            echo "Release candidate contains unexpected files:" >&2
            echo "$contents" >&2
            exit 1
          fi
          integrity=$(node -e "const fs=require('node:fs');const c=require('node:crypto');process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          echo "integrity=$integrity" >> "$GITHUB_ENV"

      - name: Smoke test the exact tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/consumer"
          npm install --prefix "$RUNNER_TEMP/consumer" "$tarball" --registry=https://registry.npmjs.org
          installed=$("$RUNNER_TEMP/consumer/node_modules/.bin/mybrowser-mcp" --version)
          if [[ "$installed" != "$version" ]]; then
            echo "Installed CLI version $installed does not match $version." >&2
            exit 1
          fi
          npm audit --prefix "$RUNNER_TEMP/consumer" --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Publish with npm trusted publishing
        working-directory: MyBrowser/server
        run: npm publish "$tarball" --access public

      - name: Verify the public package
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..12}; do
            published=$(npm view "$package@$version" dist.integrity --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [[ "$published" == "$integrity" ]]; then
              latest=$(npm view "$package" version --registry=https://registry.npmjs.org)
              if [[ "$latest" != "$version" ]]; then
                echo "npm latest resolves to $latest instead of $version." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve the verified integrity for $package@$version." >&2
          exit 1
