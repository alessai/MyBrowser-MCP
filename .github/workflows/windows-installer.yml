name: Windows installer

on:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'README.md'
      - 'scripts/windows/**'
      - 'MyBrowser/extension/package*.json'
      - 'MyBrowser/extension/wxt.config.ts'
      - 'MyBrowser/extension/src/public/mybrowser.local.json'
      - 'MyBrowser/extension/src/lib/installer-bootstrap*'
      - 'MyBrowser/extension/src/entrypoints/background/index.ts'
      - 'MyBrowser/server/package*.json'
      - 'MyBrowser/server/src/release-contract.test.ts'
      - 'MyBrowser/server/src/auth*'
      - 'MyBrowser/server/src/hub-autostart*'
      - 'MyBrowser/server/src/hub-startup.test.ts'
      - 'MyBrowser/server/src/index.ts'
      - 'MyBrowser/server/src/server.ts'
      - 'MyBrowser/server/src/test-fixtures/**'
      - 'MyBrowser/server/src/ws-server.ts'
      - 'MyBrowser/server/src/version.ts'
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'README.md'
      - 'scripts/windows/**'
      - 'MyBrowser/extension/package*.json'
      - 'MyBrowser/extension/wxt.config.ts'
      - 'MyBrowser/extension/src/public/mybrowser.local.json'
      - 'MyBrowser/extension/src/lib/installer-bootstrap*'
      - 'MyBrowser/extension/src/entrypoints/background/index.ts'
      - 'MyBrowser/server/package*.json'
      - 'MyBrowser/server/src/release-contract.test.ts'
      - 'MyBrowser/server/src/auth*'
      - 'MyBrowser/server/src/hub-autostart*'
      - 'MyBrowser/server/src/hub-startup.test.ts'
      - 'MyBrowser/server/src/index.ts'
      - 'MyBrowser/server/src/server.ts'
      - 'MyBrowser/server/src/test-fixtures/**'
      - 'MyBrowser/server/src/ws-server.ts'
      - 'MyBrowser/server/src/version.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            MyBrowser/extension/package-lock.json
            MyBrowser/server/package-lock.json

      - name: Test and build the extension bootstrap
        working-directory: MyBrowser/extension
        run: |
          npm ci
          npm test -- src/lib/installer-bootstrap.test.ts
          npx tsc --noEmit
          npm run zip
          if (-not (Test-Path '.output/chrome-mv3/mybrowser.local.json')) {
            throw 'Extension build omitted the installer bootstrap placeholder.'
          }
          if ((Get-Content '.output/chrome-mv3/mybrowser.local.json' -Raw).Trim() -ne 'null') {
            throw 'Extension build contains a non-empty public bootstrap.'
          }
          $extensionZip = @(Get-ChildItem '.output/mybrowser-extension-*-chrome.zip')
          if ($extensionZip.Count -ne 1) {
            throw 'Extension build did not produce exactly one release ZIP.'
          }
          Copy-Item $extensionZip[0].FullName "$env:RUNNER_TEMP\$($extensionZip[0].Name)"

      - name: Verify paired release metadata
        working-directory: MyBrowser/server
        run: |
          npm ci
          npm test -- src/release-contract.test.ts src/auth.test.ts src/hub-startup.test.ts src/hub-autostart.test.ts
          npm run check

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\install-mybrowser.tests.ps1

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\scripts\windows\install-mybrowser.tests.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Error,Warning
          if ($issues) {
            $issues | Format-List RuleName, ScriptName, Line, Message
            exit 1
          }

      - name: Create local MCP config
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\MyBrowserMcp" | Out-Null
          @{
            token = 'SECRET_WINDOWS_BOOTSTRAP_CANARY_8412'
            host = '0.0.0.0'
            port = 9010
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\MyBrowserMcp\config.json" -Encoding UTF8

      - name: Smoke test the CMD installer
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYBROWSER_NO_PAUSE: '1'
        run: scripts\windows\install-mybrowser.cmd -InstallDirectory "%RUNNER_TEMP%\MyBrowser\Extension" -McpConfigPath "%RUNNER_TEMP%\MyBrowserMcp\config.json" -NoLaunch > "%RUNNER_TEMP%\installer-output.txt" 2>&1

      - name: Verify installed manifest
        shell: powershell
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP\MyBrowser\Extension\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'MyBrowser' -or $manifest.manifest_version -ne 3) {
            throw 'CMD installer produced an invalid extension manifest.'
          }
          $bootstrap = Get-Content "$env:RUNNER_TEMP\MyBrowser\Extension\mybrowser.local.json" -Raw | ConvertFrom-Json
          if ($bootstrap.serverAddress -ne '127.0.0.1' -or
              $bootstrap.serverPort -ne 9010 -or
              $bootstrap.authToken -ne 'SECRET_WINDOWS_BOOTSTRAP_CANARY_8412' -or
              $bootstrap.bootstrapId -notmatch '^[0-9a-f]{32}$') {
            throw 'CMD installer produced an invalid local bootstrap.'
          }
          $output = Get-Content "$env:RUNNER_TEMP\installer-output.txt" -Raw
          if ($output.Contains('SECRET_WINDOWS_BOOTSTRAP_CANARY_8412')) {
            throw 'CMD installer exposed the MCP token in output.'
          }
          Write-Output $output

      - name: Refresh rotated local MCP config
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYBROWSER_NO_PAUSE: '1'
        run: |
          @{
            token = 'ROTATED_WINDOWS_BOOTSTRAP_CANARY_9247'
            host = '0.0.0.0'
            port = 9011
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\MyBrowserMcp\config.json" -Encoding UTF8
          & .\scripts\windows\install-mybrowser.cmd `
            -InstallDirectory "$env:RUNNER_TEMP\MyBrowser\Extension" `
            -McpConfigPath "$env:RUNNER_TEMP\MyBrowserMcp\config.json" `
            -NoLaunch *> "$env:RUNNER_TEMP\refresh-output.txt"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\refresh-output.txt"
            throw 'CMD installer failed to refresh the local MCP config.'
          }
          $bootstrap = Get-Content "$env:RUNNER_TEMP\MyBrowser\Extension\mybrowser.local.json" -Raw | ConvertFrom-Json
          if ($bootstrap.serverPort -ne 9011 -or $bootstrap.authToken -ne 'ROTATED_WINDOWS_BOOTSTRAP_CANARY_9247') {
            throw 'CMD installer did not refresh the rotated local MCP config.'
          }
          $output = Get-Content "$env:RUNNER_TEMP\refresh-output.txt" -Raw
          if ($output.Contains('ROTATED_WINDOWS_BOOTSTRAP_CANARY_9247')) {
            throw 'CMD installer exposed the rotated MCP token in output.'
          }
          if (-not $output.Contains('Local MCP config changed; refreshing')) {
            throw 'CMD installer did not take the same-version refresh path.'
          }
          Write-Output $output

      - name: Package the installer
        shell: powershell
        run: |
          Compress-Archive -Path @(
            'scripts/windows/install-mybrowser.cmd',
            'scripts/windows/install-mybrowser.ps1',
            'scripts/windows/README.md'
          ) -DestinationPath "$env:RUNNER_TEMP\mybrowser-windows-installer.zip"

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: mybrowser-windows-installer
          path: ${{ runner.temp }}\mybrowser-windows-installer.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: mybrowser-extension
          path: ${{ runner.temp }}\mybrowser-extension-*-chrome.zip
          if-no-files-found: error
          retention-days: 14
