name: Windows installer

on:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'README.md'
      - 'scripts/windows/**'
      - 'MyBrowser/extension/package*.json'
      - 'MyBrowser/extension/wxt.config.ts'
      - 'MyBrowser/extension/src/public/mybrowser.local.json'
      - 'MyBrowser/extension/src/lib/installer-bootstrap*'
      - 'MyBrowser/extension/src/entrypoints/background/index.ts'
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'README.md'
      - 'scripts/windows/**'
      - 'MyBrowser/extension/package*.json'
      - 'MyBrowser/extension/wxt.config.ts'
      - 'MyBrowser/extension/src/public/mybrowser.local.json'
      - 'MyBrowser/extension/src/lib/installer-bootstrap*'
      - 'MyBrowser/extension/src/entrypoints/background/index.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MyBrowser/extension/package-lock.json

      - name: Test and build the extension bootstrap
        working-directory: MyBrowser/extension
        run: |
          npm ci
          npm test -- src/lib/installer-bootstrap.test.ts
          npx tsc --noEmit
          npm run build
          if (-not (Test-Path '.output/chrome-mv3/mybrowser.local.json')) {
            throw 'Extension build omitted the installer bootstrap placeholder.'
          }

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\install-mybrowser.tests.ps1

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\scripts\windows\install-mybrowser.tests.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Error,Warning
          if ($issues) {
            $issues | Format-List RuleName, ScriptName, Line, Message
            exit 1
          }

      - name: Create local MCP config
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\MyBrowserMcp" | Out-Null
          @{
            token = 'SECRET_WINDOWS_BOOTSTRAP_CANARY_8412'
            host = '0.0.0.0'
            port = 9010
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\MyBrowserMcp\config.json" -Encoding UTF8

      - name: Smoke test the CMD installer
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYBROWSER_NO_PAUSE: '1'
        run: scripts\windows\install-mybrowser.cmd -InstallDirectory "%RUNNER_TEMP%\MyBrowser\Extension" -McpConfigPath "%RUNNER_TEMP%\MyBrowserMcp\config.json" -NoLaunch > "%RUNNER_TEMP%\installer-output.txt" 2>&1

      - name: Verify installed manifest
        shell: powershell
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP\MyBrowser\Extension\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'MyBrowser' -or $manifest.manifest_version -ne 3) {
            throw 'CMD installer produced an invalid extension manifest.'
          }
          $bootstrap = Get-Content "$env:RUNNER_TEMP\MyBrowser\Extension\mybrowser.local.json" -Raw | ConvertFrom-Json
          if ($bootstrap.serverAddress -ne '127.0.0.1' -or
              $bootstrap.serverPort -ne 9010 -or
              $bootstrap.authToken -ne 'SECRET_WINDOWS_BOOTSTRAP_CANARY_8412' -or
              $bootstrap.bootstrapId -notmatch '^[0-9a-f]{32}$') {
            throw 'CMD installer produced an invalid local bootstrap.'
          }
          $output = Get-Content "$env:RUNNER_TEMP\installer-output.txt" -Raw
          if ($output.Contains('SECRET_WINDOWS_BOOTSTRAP_CANARY_8412')) {
            throw 'CMD installer exposed the MCP token in output.'
          }
          Write-Output $output

      - name: Package the installer
        shell: powershell
        run: |
          Compress-Archive -Path @(
            'scripts/windows/install-mybrowser.cmd',
            'scripts/windows/install-mybrowser.ps1',
            'scripts/windows/README.md'
          ) -DestinationPath "$env:RUNNER_TEMP\mybrowser-windows-installer.zip"

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: mybrowser-windows-installer
          path: ${{ runner.temp }}\mybrowser-windows-installer.zip
          if-no-files-found: error
          retention-days: 14
